name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 既定は読み取りだけ。書き込み権限は release ジョブにだけ与える（PR のビルドに書き込みトークンを渡さない）
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build portable exe
        run: npm run dist:win
      - name: Smoke test (packaged app on Windows)
        run: node test/electron/smoke.mjs
        env:
          APP_EXE: dist/win-unpacked/bukatsu-taikai.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bukatsu-taikai-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    # タグ push のときだけ動き、build が作った exe を GitHub Release に添付する
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bukatsu-taikai-windows
          path: dist
      - name: Attach exe to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
