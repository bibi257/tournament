
name: Robin AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    # 第三者のワークフローは、コミット SHA に固定する（@main のままだと、参照先が書き換わると
    # シークレット付きで任意のコードが動く）。更新するときは、SHA を確かめてから書き換える。
    # 固定した時点の main: 3c3c2adf29f06277761f827c64ee9d08d90c00c6（chore: release 2.12.3 (#118)）
    uses: antongulin/robin/.github/workflows/review.yml@3c3c2adf29f06277761f827c64ee9d08d90c00c6
    with:
      review-on-synchronize: true
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
