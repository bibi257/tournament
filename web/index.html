<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>部内大会トーナメント</title>
  <meta name="description" content="部内大会のトーナメント表・総当たり表を作成し、結果入力・順位集計・CSV/PNG出力ができるアプリ">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" id="app-header">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 6h8v6h6v8h-6v6H4v-4h4v-4h6v-4H8V10H4z" fill="#fff"/><path d="M18 14h10v4H18z" fill="#6fa5ea"/></svg><span class="brand-name">部内大会トーナメント</span></div>
    <div class="print-title" id="print-title"></div>
    <span class="save-status owner-only no-print" id="save-status" aria-live="polite"></span>
    <button type="button" class="menu-btn no-print" id="menu-btn" aria-label="メニュー" aria-expanded="false" aria-controls="header-actions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="header-actions no-print" id="header-actions">
      <button type="button" data-action="undo" class="owner-only" id="undo-btn" title="直前の操作を取り消します（Ctrl+Z）" disabled><svg class="mi-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="mi-body"><span class="mi-text">元に戻す</span><small class="mi-sub" id="undo-sub"></small></span></button>
      <button type="button" data-action="new" class="owner-only danger"><svg class="mi-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="mi-text"><span class="pc-only">新規</span><span class="m-only">新しい大会を始める</span></span></button>
      <button type="button" data-action="save" class="owner-only" title="大会データをファイルに保存"><svg class="mi-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="mi-text">保存</span></button>
      <button type="button" data-action="load" class="owner-only" title="保存した大会データを開く"><svg class="mi-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="mi-text">読込</span></button>
      <button type="button" data-action="print"><svg class="mi-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="mi-text">印刷</span></button>
      <button type="button" data-action="share" title="大会データを公開して、スマホなどから見られるようにする"><svg class="mi-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="mi-text">共有</span></button>
      <input type="file" id="load-file" accept=".json,application/json" hidden>
      <button type="button" class="share-chip" id="share-chip" data-action="share" hidden></button>
    </div>
  </header>
  <div class="menu-scrim no-print" id="menu-scrim" hidden></div>

  <nav class="tabs no-print" role="tablist" aria-label="画面切替">
    <button type="button" role="tab" data-tab="setup" class="owner-only" aria-selected="true">参加者・設定</button>
    <button type="button" role="tab" data-tab="tournament" aria-selected="false">トーナメント</button>
    <button type="button" role="tab" data-tab="league" aria-selected="false">総当たり</button>
    <button type="button" role="tab" data-tab="standings" aria-selected="false">順位表</button>
    <button type="button" role="tab" data-tab="comments" id="tab-comments" aria-selected="false" hidden>コメント</button>
  </nav>

  <div id="edition-banner" class="edition-banner no-print" hidden></div>

  <main>
    <div id="my-panel" class="my-panel no-print" hidden></div>
    <section id="panel-setup" class="tab-panel" role="tabpanel"></section>
    <section id="panel-tournament" class="tab-panel" role="tabpanel" hidden></section>
    <section id="panel-league" class="tab-panel" role="tabpanel" hidden></section>
    <section id="panel-standings" class="tab-panel" role="tabpanel" hidden></section>
    <section id="panel-comments" class="tab-panel" role="tabpanel" hidden></section>
  </main>

  <dialog id="result-dialog" aria-labelledby="rd-title">
    <form method="dialog" id="result-form" novalidate>
      <div class="rd-body">
        <h2 id="rd-title">試合結果</h2>
        <p class="rd-sub" id="rd-sub"></p>
        <p class="rd-sub rd-versus" id="rd-versus" hidden></p>
        <div class="rd-grid">
          <div class="rd-row">
            <label class="rd-player"><input type="radio" name="outcome" value="p1"><span class="rd-name" id="rd-p1"></span><span class="rd-badge">勝者</span></label>
            <input class="rd-score" id="rd-s1" inputmode="numeric" autocomplete="off" aria-label="選手1のスコア">
          </div>
          <span class="rd-dash">－</span>
          <div class="rd-row">
            <input class="rd-score" id="rd-s2" inputmode="numeric" autocomplete="off" aria-label="選手2のスコア">
            <label class="rd-player rd-right"><span class="rd-name" id="rd-p2"></span><span class="rd-badge">勝者</span><input type="radio" name="outcome" value="p2"></label>
          </div>
        </div>
        <p class="hint">スコアを入力すると勝者が自動で選ばれます。スコアなしで勝者だけ選んでも構いません。</p>
        <div class="rd-options">
          <label id="rd-draw-wrap"><input type="radio" name="outcome" value="draw"> 引き分け</label>
          <label><input type="checkbox" id="rd-walkover"> 不戦勝（相手の棄権・欠席）</label>
          <label>卓 <select id="rd-table"></select></label>
        </div>
      </div>
      <div class="rd-foot">
        <p class="error" id="rd-error" role="alert"></p>
        <div class="dialog-buttons">
          <button type="button" id="rd-clear" class="danger">結果を取り消す</button>
          <button type="button" id="rd-unstart" hidden>開始を取り消す</button>
          <span class="spacer"></span>
          <button type="button" id="rd-cancel">キャンセル</button>
          <button type="button" id="rd-next" title="保存して、次に行う試合の入力を開きます（Ctrl+Enter）">保存して次へ</button>
          <button type="submit" id="rd-ok" class="primary">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="call-screen" aria-labelledby="cs-title">
    <header class="cs-head">
      <div class="cs-heading">
        <h2 id="cs-title"></h2>
        <p class="cs-sub" id="cs-sub"></p>
      </div>
      <p class="cs-progress" id="cs-progress"></p>
      <div class="cs-actions">
        <button type="button" id="cs-window" title="呼び出し画面だけを別のウィンドウで開きます（プロジェクターに映しながら、この画面で入力できます）">別ウィンドウで開く</button>
        <button type="button" id="cs-full">全画面</button>
        <button type="button" id="cs-close">閉じる</button>
      </div>
    </header>
    <div class="cs-body" id="cs-body" aria-live="polite"></div>
  </dialog>

  <dialog id="qr-dialog" aria-labelledby="qr-title">
    <div class="qr-body">
      <h2 id="qr-title"></h2>
      <p class="qr-lead">スマホのカメラでこのQRコードを読み取ると、大会の表が見られます。</p>
      <div class="qr-img" id="qr-img" role="img" aria-label="閲覧リンクのQRコード"></div>
      <p class="qr-link" id="qr-link"></p>
      <div class="dialog-buttons">
        <button type="button" id="qr-full">全画面</button>
        <button type="button" id="qr-png">画像（PNG）で保存</button>
        <span class="spacer"></span>
        <button type="button" class="primary" id="qr-close">閉じる</button>
      </div>
    </div>
  </dialog>

  <dialog id="pairing-dialog" aria-labelledby="pr-title">
    <form method="dialog" id="pairing-form">
      <h2 id="pr-title">トーナメントの組み合わせ（1回戦）</h2>
      <p class="hint">この組み合わせで作成します。入れ替えたい選手を、2人続けて押してください（1人目を押すと色が付き、2人目を押すと位置が入れ替わります）。</p>
      <ol id="pr-list" class="pairing"></ol>
      <p id="pr-status" class="pr-status" role="status" aria-live="polite"></p>
      <div class="dialog-buttons">
        <button type="button" id="pr-redraw" hidden>抽選をやり直す</button>
        <span class="spacer"></span>
        <button type="button" id="pr-cancel">キャンセル</button>
        <button type="button" class="primary" id="pr-ok">この組み合わせで作成</button>
      </div>
    </form>
  </dialog>

  <dialog id="choice-dialog" aria-labelledby="ch-title">
    <form method="dialog" id="choice-form">
      <h2 id="ch-title"></h2>
      <p id="ch-body" class="hint"></p>
      <div class="rd-options" id="ch-options"></div>
      <div class="dialog-buttons">
        <span class="spacer"></span>
        <button type="button" id="ch-cancel">キャンセル</button>
        <button type="submit" class="primary" id="ch-ok">決定</button>
      </div>
    </form>
  </dialog>

  <dialog id="import-dialog" aria-labelledby="im-title">
    <form method="dialog" id="import-form">
      <h2 id="im-title">参加者の一括入力・CSV取込</h2>
      <p class="hint">1行に1人ずつ入力するか、CSVファイルを選んでください（1行目が「名前」「氏名」なら見出しとして扱います。Shift_JIS・UTF-8 に対応）。</p>
      <p><button type="button" id="im-file-btn">CSVファイルを選ぶ</button> <input type="file" id="im-file" accept=".csv,.txt,text/csv,text/plain" hidden> <span id="im-file-name"></span></p>
      <textarea id="im-text" rows="10" placeholder="山田 太郎&#10;佐藤 花子&#10;…"></textarea>
      <div class="rd-options">
        <label><input type="radio" name="im-mode" value="append" checked> 今の名簿に追加</label>
        <label><input type="radio" name="im-mode" value="replace"> 今の名簿と置き換え</label>
      </div>
      <p class="error" id="im-error" role="alert"></p>
      <div class="dialog-buttons">
        <span class="spacer"></span>
        <button type="button" id="im-cancel">キャンセル</button>
        <button type="submit" class="primary">取り込む</button>
      </div>
    </form>
  </dialog>

  <dialog id="share-dialog" aria-labelledby="sh-title">
    <div class="share-box">
      <h2 id="sh-title">共有</h2>
      <div id="share-body"></div>
      <p class="error" id="sh-error" role="alert"></p>
      <div class="dialog-buttons"><span class="spacer"></span><button type="button" id="sh-close">閉じる</button></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
